services:
  mysql:
    image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
    command: ["--collation-server=utf8mb4_0900_ai_ci", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_DATABASE: website_papa_v2_testing
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  app-laravel:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    working_dir: /artifact/papa-website-v2
    volumes:
      - ../..:/artifact
      - composer-cache:/tmp/composer-cache
    environment: &testing-environment
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: website_papa_v2_testing
      DB_USERNAME: root
      DB_PASSWORD: ""
      RULE_ENGINE_URL: http://rule-engine-go:8081
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      COMPOSER_MAX_PARALLEL_HTTP: "2"
      COMPOSER_PROCESS_TIMEOUT: "1800"
      TZ: Asia/Jakarta
      LC_ALL: C.UTF-8
    command: ["sh", "-lc", "composer install --no-interaction --prefer-dist --no-progress && php artisan serve --host=0.0.0.0 --port=8000"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8000); exit($$s?0:1);'"]
      interval: 5s
      timeout: 5s
      retries: 360
    depends_on:
      mysql:
        condition: service_healthy

  rule-engine-go:
    build:
      context: .
      dockerfile: Dockerfile.go.template
    working_dir: /artifact/engine-rms
    volumes:
      - ../..:/artifact
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "run", "."]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 360

  validation-runner:
    build:
      context: .
      dockerfile: Dockerfile.validation
    working_dir: /artifact/engine-rms/differential_validation
    volumes:
      - ../..:/artifact
      - composer-cache:/tmp/composer-cache
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      <<: *testing-environment
      ENGINE_DIR: /artifact/engine-rms
      LARAVEL_DIR: /artifact/papa-website-v2
      RUNS_DIR: /artifact/engine-rms/differential_validation/runs
      USE_EXTERNAL_FIXED_ENGINE: "1"
      ALLOW_DIRTY: "0"
    command: ["bash", "./clean_validate.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      app-laravel:
        condition: service_healthy
      rule-engine-go:
        condition: service_healthy

volumes:
  composer-cache:
  go-module-cache:
  go-build-cache:
