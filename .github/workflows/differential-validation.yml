name: differential-validation

on:
  workflow_dispatch:
    inputs:
      run_temporal_replay:
        description: Run the long current-source Temporal Replay v2 experiment
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_DATABASE: website_papa_v2_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - name: Check out engine and validation package
        uses: actions/checkout@v6
        with:
          path: engine-rms
          fetch-depth: 0
      - name: Check out Laravel application
        uses: actions/checkout@v6
        with:
          repository: alvinaaulia/papa-web
          path: papa-website-public
          ref: ${{ vars.LARAVEL_RESEARCH_REF || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: engine-rms/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, curl
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Laravel dependencies
        working-directory: papa-website-public
        run: |
          composer install --no-interaction --prefer-dist
          git restore -- bootstrap/cache
      - name: Install and build frontend assets
        working-directory: papa-website-public
        run: |
          npm ci || npm ci
          npm run build
      - name: Record paired source revisions
        shell: bash
        run: |
          printf 'engine_commit=%s\n' "$(git -C engine-rms rev-parse HEAD)" | tee paired-source-revisions.txt
          printf 'laravel_commit=%s\n' "$(git -C papa-website-public rev-parse HEAD)" | tee -a paired-source-revisions.txt
      - name: Verify published research provenance tags
        shell: bash
        run: |
          for tag in \
            tpr-ir-differential-baseline-v1 \
            tpr-ir-differential-fixed-v1 \
            tpr-ir-evidence-hardening-v2
          do
            printf 'engine_%s=%s\n' "$tag" "$(git -C engine-rms rev-parse "$tag^{commit}")" | tee -a paired-source-revisions.txt
            printf 'laravel_%s=%s\n' "$tag" "$(git -C papa-website-public rev-parse "$tag^{commit}")" | tee -a paired-source-revisions.txt
          done
      - name: Fast source quality gates
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: website_papa_v2_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          cd engine-rms
          go test -short ./... -count=1 -timeout=3m
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          cd ../papa-website-public
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --env=testing --force
          php artisan test tests/Unit tests/Feature/RuleVersionActionWorkflowTest.php --stop-on-failure
          composer audit --locked
          npm audit --package-lock-only --audit-level=high
      - name: Browser accessibility and desktop smoke tests
        working-directory: papa-website-public
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: website_papa_v2_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: npm run test:browser
      - name: Execute commit-bound evidence pipeline
        id: evidence_pipeline
        working-directory: engine-rms/differential_validation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: website_papa_v2_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
          ENGINE_DIR: ${{ github.workspace }}/engine-rms
          LARAVEL_DIR: ${{ github.workspace }}/papa-website-public
          RUNS_DIR: ${{ github.workspace }}/engine-rms/differential_validation/runs
          SOURCE_SNAPSHOT_VERIFIED: '1'
          CLEAN_OUTPUTS: '1'
          ALLOW_DIRTY: '0'
        run: make differential-validation
      - name: Surface failed evidence command
        if: ${{ failure() && steps.evidence_pipeline.outcome == 'failure' }}
        working-directory: engine-rms
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          found = False
          for meta_path in sorted(Path('differential_validation/runs').rglob('*.meta.json')):
              try:
                  meta = json.loads(meta_path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  continue
              if meta.get('exit_code') in (None, 0):
                  continue
              found = True
              details = []
              for key in ('stdout_file', 'stderr_file'):
                  log_name = meta.get(key)
                  if not log_name:
                      continue
                  log_path = meta_path.parent / log_name
                  if log_path.is_file():
                      lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
                      details.extend(lines[-12:])
              message = ' | '.join(details)[-1800:] or 'No captured output.'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              command = ' '.join(str(part) for part in meta.get('command', []))
              title = f"Evidence command failed (exit {meta.get('exit_code')}): {command}"
              print(f"::error file={meta_path}::{title}. {message}")
          if not found:
              print('::error::Evidence pipeline failed before a command metadata file recorded the cause.')
          PY
      - name: Generate commit-bound Go coverage evidence
        if: ${{ !cancelled() }}
        working-directory: engine-rms
        shell: bash
        run: |
          go test ./... -coverprofile=coverage-current.out -count=1
          {
            printf 'engine_commit=%s\n' "$(git rev-parse HEAD)"
            go version
            go tool cover -func=coverage-current.out
          } | tee coverage-evidence-go.txt
      - name: Upload raw evidence and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-validation-evidence
          path: |
            engine-rms/differential_validation/runs
            engine-rms/differential_validation/*REPORT*.md
            engine-rms/differential_validation/final-report-data.json
            engine-rms/differential_validation/DIFFERENTIAL_VALIDATION_FINAL_REPORT_V3.md
            engine-rms/differential_validation/runs/clean-environment
            engine-rms/coverage-evidence-go.txt
            engine-rms/coverage-current.out
            paired-source-revisions.txt

  temporal-replay-v2:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_temporal_replay) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[temporal-replay]'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_DATABASE: website_papa_v2_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v6
        with:
          path: engine-rms
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: alvinaaulia/papa-web
          path: papa-website-public
          ref: ${{ vars.LARAVEL_RESEARCH_REF || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: engine-rms/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, curl, bcmath, dom, gd, zip
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r engine-rms/differential_validation/requirements.txt
      - name: Install locked Laravel dependencies
        working-directory: papa-website-public
        run: |
          composer install --no-interaction --prefer-dist
          git restore -- bootstrap/cache
          cp .env.example .env
          php artisan key:generate --force --no-ansi
      - name: Execute current-source Temporal Replay v2
        working-directory: engine-rms/differential_validation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: website_papa_v2_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
          ENGINE_DIR: ${{ github.workspace }}/engine-rms
          LARAVEL_DIR: ${{ github.workspace }}/papa-website-public
        run: make clean-temporal-v2
      - name: Surface failed Temporal Replay v2 command
        if: failure()
        working-directory: engine-rms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('differential_validation/runs/temporal-replay-v2')
          runs = [path for path in root.glob('temporal-v2-*') if path.is_dir()]
          if not runs:
              print('::error::Temporal Replay v2 failed before a run directory was created.')
              raise SystemExit(0)
          run = max(runs, key=lambda path: path.stat().st_mtime)
          failures = []
          for exit_file in sorted((run / 'raw-logs').glob('*.exit-code.txt')):
              code = exit_file.read_text(encoding='utf-8', errors='replace').strip()
              if code in ('', '0'):
                  continue
              base = str(exit_file)[:-len('.exit-code.txt')]
              details = []
              for suffix in ('.stderr.log', '.stdout.log'):
                  log = Path(base + suffix)
                  if log.is_file():
                      details.extend(log.read_text(encoding='utf-8', errors='replace').splitlines()[-40:])
              message = ' | '.join(details)[-1800:] or 'No captured output.'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file={exit_file}::Temporal Replay step failed with exit {code}. {message}')
              failures.append(exit_file)
          if not failures:
              logs = list((run / 'raw-logs').glob('*.stderr.log')) + list((run / 'raw-logs').glob('*.stdout.log'))
              latest = max(logs, key=lambda path: path.stat().st_mtime) if logs else None
              message = 'No captured output.' if latest is None else ' | '.join(
                  latest.read_text(encoding='utf-8', errors='replace').splitlines()[-80:]
              )[-1800:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::Temporal Replay v2 stopped without a recorded failing exit code. {message}')
          PY
      - name: Upload Temporal Replay v2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temporal-replay-v2-current-source
          path: engine-rms/differential_validation/runs/temporal-replay-v2
